# Z3ST: An open-source FEniCSx framework for thermo-mechanical analysis
# Author: Giovanni Zullo
# Version: 0.3.0 (2026)
# --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. ---

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z3st"
version = "0.3.0"
description = "Z3ST: An open-source FEniCSx framework for thermo-mechanical analysis"
authors = [
  {name = "Giovanni Zullo", email = "giovanni.zullo@polimi.it"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

# Dependencies (pip-installable only)
dependencies = [
    "numpy>=2",   # np.trapezoid (numpy 2 API) is used across the verification cases
    "scipy",      # cKDTree (gap/contact pairing), special.k0 (analytic source term)
    "matplotlib",
    "pyvista>=0.42",
    "pyyaml",
    "gmsh",       # utils/geo_files/pellet_fragmented.py (run by hand)
    "h5py",       # utils/utils_extract_xdmf.py, imported by 18 non-regression scripts
    "shapely",    # utils/geo_files/pellet_fragmented.py, alongside gmsh above
]

[project.urls]
Homepage = "https://github.com/giozu/z3st"

[project.optional-dependencies]
# Post-processing of output files, genuinely optional: pandas is used by one study
# script (cases/studies/attenuation_map/plot_map.py), which iterates over groups with
# df.groupby() and sorts on two columns -- ~15 clear lines that numpy would turn into
# ~40 of structured arrays. The library itself is pandas-free.
#
# h5py was here until 2026-08-09 and it was a mistake: utils/utils_extract_xdmf.py is
# library code, so "not needed to run a case" was false -- it is needed to *check* one,
# and Allrun does both. Six CI cases died on ModuleNotFoundError. It went unnoticed
# locally because the conda dolfinx stack pulls h5py in transitively, so no local run
# can reveal an undeclared dependency.
post = [
    "pandas",
]

# Optional dependencies for docs
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme",
]

# Optional developer tools
dev = [
    "pyflakes",   # utils/audit_checks.py: its 'names' check, and it says to install this
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
]

# Optional: Neural network material laws, via FEniCSx external operators.
nn = [
    "torch",
    "dolfinx-external-operator",  # imported lazily by nn_conductivity and thermal_model
    "setuptools>=77.0.3,<82",  # torch requires <82; fenics-ffcx requires >=77.0.3
]

[tool.black]
line-length = 100
target-version = ['py310']
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
