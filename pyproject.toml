# Z3ST: An open-source FEniCSx framework for thermo-mechanical analysis
# Author: Giovanni Zullo
# Version: 0.2.0 (2026)
# --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. ---

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z3st"
version = "0.2.0"
description = "Z3ST: An open-source FEniCSx framework for thermo-mechanical analysis"
authors = [
  {name = "Giovanni Zullo", email = "giovanni.zullo@polimi.it"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

# Dependencies (pip-installable only)
dependencies = [
    "numpy>=2",   # np.trapezoid (numpy 2 API) is used across the verification cases
    "scipy",      # cKDTree (gap/contact pairing), special.k0 (analytic source term)
    "matplotlib",
    "pyvista>=0.42",
    "pyyaml",
    "gmsh",       # utils/geo_files/pellet_fragmented.py (run by hand)
]

[project.urls]
Homepage = "https://github.com/giozu/z3st"

[project.optional-dependencies]
# Post-processing of output files. Not needed to run a case: h5py reads the XDMF
# HDF5 sidecar, pandas is used by one study script (cases/studies/attenuation_map).
post = [
    "h5py",
    "pandas",
]

# Optional dependencies for docs
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme",
]

# Optional developer tools
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
]

# Optional: Neural network material laws, via FEniCSx external operators.
nn = [
    "torch",
    "setuptools>=77.0.3,<82",  # torch requires <82; fenics-ffcx requires >=77.0.3
]

[tool.black]
line-length = 100
target-version = ['py310']
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
