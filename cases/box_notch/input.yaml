# Zest: A FEniCSx module for fuel performance modeling
# =====================================================
# Author: Giovanni Zullo
# Date: 16/01/2025

# Description:
# ------------
# Zest is a thermomechanical fuel performance code written in Python.
# This project is currently under development.

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  fuel: ../../materials/uo2.yaml

solver_settings:
  coupling: staggered # monolithic, staggered
  thermal_solver: iterative_amg # direct_mumps, iterative_amg, iterative_hypre
  tol: 1e-2
  tol_T: 1e-2
  tol_u: 1e-2
  tol_mech: 1e-4
  tol_th: 1e-6
  relax_T: 0.7
  relax_u: 0.7
  n_iter_max: 30

models:
  thermal: False
  mechanical: True
  fracture: True
  # gap_conductance

mechanical:
  solver: linear           # linear | nonlinear
  linear_solver: iterative_hypre   # direct_mumps | iterative_amg | iterative_hypre
  # solver: nonlinear
  # nonlinear_solver: newton
  # nonlinear_line_search: cp   # cp | bt

fracture:
  model: AT2
  sigma_c: 1.0e+8   # Pa
  kappa: 1.0e-8
  split: amor_dev_vol
  irreversibility: history
  Gc: 10000.0   # J/m^2 (o N/m)
  ell: 5.0e-7  # m
  eta: 1.0e-8

mechanical_regime: "3D" # 3D, plane_stress

lhr:
  - 0
time:
  - 0
n_steps: 1

