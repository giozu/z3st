# Zest: A FEniCSx module for fuel performance modeling
# =====================================================
# Author: Giovanni Zullo
# Date: 16/01/2025

# Description:
# ------------
# Zest is a thermomechanical fuel performance code written in Python.
# This project is currently under development.

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  steel: ../../materials/steel.yaml

solver_settings:
  coupling: staggered # monolithic, staggered
  thermal_solver: iterative_amg # direct_mumps, iterative_amg, iterative_hypre
  mechanical_solver: iterative_hypre # direct_mumps, iterative_amg, iterative_hypre
  tol: 1e-2
  tol_T: 1e-2
  tol_u: 1e-2
  tol_mech: 1e-4
  tol_th: 1e-6
  relax_T: 0.7
  relax_u: 0.7
  n_iter_max: 30

models:
  thermal: False
  mechanical: True
  fracture: True
  # gap_conductance

fracture:
  model: AT2
  Gc: 10         # N/m  (per test; vedi nota 5 per tuning)
  sigma_c: 1.0e+8   # Pa
  ell: 0.5e-3    # m     (≈ 0.5 mm: scegli ~ h/2 nella zona di crack)
  kappa: 1.0e-8
  split: amor_dev_vol
  irreversibility: history

mechanical_regime: "3D" # 3D, plane_stress

lhr:
  - 0
time:
  - 0
n_steps: 1

