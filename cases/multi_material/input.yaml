# Zest: A FEniCSx module for fuel performance modeling
# =====================================================
# Author: Giovanni Zullo
# Date: 16/01/2025

# Description:
# ------------
# Zest is a thermomechanical fuel performance code written in Python.
# This project is currently under development.

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  fuel: ../../materials/uo2.yaml
  cladding: ../../materials/T91.yaml

solver_settings:
  coupling: staggered
  thermal_solver: iterative_hypre # direct_mumps, iterative_amg, iterative_hypre
  mechanical_solver: iterative_hypre # direct_mumps, iterative_amg, iterative_hypre
  tol: 1e-2
  tol_T: 1e-5
  tol_u: 1e-5
  tol_mech: 1e-10
  tol_th: 1e-10
  relax_T: 0.7
  relax_u: 0.8
  n_iter_max: 50

models:
  thermal: True
  mechanical: True

mechanical_regime: "3D" # 3D, plane_stress

lhr:
  - 0
time:
  - 0
n_steps: 1

