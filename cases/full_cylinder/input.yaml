# Zest: A FEniCSx module for fuel performance modeling
# =====================================================
# Author: Giovanni Zullo
# Date: 16/01/2025

# Description:
# ------------
# Zest is a thermomechanical fuel performance code written in Python.
# This project is currently under development.

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  fuel: ../../materials/uo2.yaml

solver_settings:
  coupling: staggered # monolithic, staggered
  max_iters: 100
  
models:
  thermal:    True
  mechanical: True
  fracture:   False

mechanical:
  solver: linear # linear | non-linear
  linear_solver: iterative_hypre # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1e-8 # relative tolerance for the mechanical solver
  stag_tol: 1e-3 # staggered tolerance
  mech_regime: "3D" # 3D, plane_stress
  convergence: norm # rel_norm

thermal:
  solver: linear # linear | non-linear
  linear_solver: iterative_amg # direct_mumps, iterative_amg, iterative_hypre
  rtol: 1e-8 # relative tolerance for the thermal solver
  stag_tol: 1e-3 # staggered tolerance
  convergence: rel_norm

lhr:
  - 10000
time:
  - 0
n_steps: 1 # n_steps = 0 --> no simulation

