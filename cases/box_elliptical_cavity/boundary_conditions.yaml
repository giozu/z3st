thermal_bcs:
  solid:
    - type: Dirichlet
      region: xmin
      temperature: 300.0

    - type: Dirichlet
      region: xmax
      temperature: 300.0

mechanical_bcs:
  solid:
    - type: Dirichlet
      region: xmin
      displacement: [0.0, 0.0, 0.0]

    - type: Neumann
      region: xmax
      traction: 1e9

