thermal_bcs:
  fuel:
    - type: Neumann
      region: face_xx_0_1
      value: 0.0

  cladding:
    - type: Dirichlet
      region: face_xx_1_2
      temperature: 250.0

mechanical_bcs:
  fuel:
    - type: Dirichlet
      region: bottom1
      displacement: [0.0, 0.0, 0.0]

  cladding:
    - type: Dirichlet
      region: bottom2
      displacement: [0.0, 0.0, 0.0]
