thermal_bcs:
  fuel:
    - type: Dirichlet
      region: face_xx_0_1
      temperature: 350.0
    # - type: Neumann
    #   region: face_xx_1_1
    #   flux: 0.0
  cladding:
    - type: Dirichlet
      region: face_xx_1_2
      temperature: 290.0
    # - type: Neumann
    #   region: face_xx_0_2
    #   flux: 0.0
mechanical_bcs:
  fuel:
    - type: Dirichlet
      region: bottom1
      displacement: [0.0, 0.0, 0.0]
    - type: Neumann
      region: top1
      traction: -1e6  # Pa, negative for compression
  cladding:
    - type: Dirichlet
      region: bottom2
      displacement: [0.0, 0.0, 0.0]
    - type: Neumann
      region: top2
      traction: -1e6  # Pa, negative for compression