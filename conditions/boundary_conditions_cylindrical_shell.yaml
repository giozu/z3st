thermal_bcs:
  steel:
    - type: Dirichlet
      region: inner_radius
      temperature: 573
    - type: Neumann
      region: outer_radius
      flux: 0.0
      
mechanical_bcs:
  steel:
    - type: Dirichlet
      region: bottom
      displacement: [0.0, 0.0, 0.0]
    - type: Neumann
      region: inner_radius
      traction: -7.5e-6
    - type: Neumann
      region: outer_radius
      traction: -7.5e-6
