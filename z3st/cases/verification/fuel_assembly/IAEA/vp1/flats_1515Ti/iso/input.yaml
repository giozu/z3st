# flats_1515Ti at uniform 400 °C, run by ../../Allrun flats_1515Ti
mesh_path: ../mesh.msh
geometry_path: ../geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  steel: ../15_15Ti_local.yaml

regime: 3d

solver_settings:
  max_iters: 100
  relax_T: 1.0
  relax_u: 1.0
  relax_adaptive: false

models:
  thermal: true
  mechanical: true

thermal:
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm

mechanical:
  solver: linear
  linear_solver: direct_mumps
  remove_rigid_nullspace: false # clamped at the bottom
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm

lhr:
- 0.0
- 0.0
time: # steady state
- 0.0
- 1.0
n_steps: 1

output:
  format: xdmf
  filename: fields_vp1_1515Ti_iso
