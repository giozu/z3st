mechanical:
  steel:
  - type: Clamp_x
    region: xmin

  - type: Clamp_y
    region: ymin

  - type: Dirichlet_x
    region: xmax
    # prescribed displacement ramp (m), one value per step
    displacement: [0.00e+00, 5.00e-05, 1.00e-04, 1.50e-04, 2.00e-04, 2.50e-04, 3.00e-04, 4.00e-04, 6.00e-04, 8.00e-04]

thermal:
  steel:
  - type: Dirichlet
    region: xmin
    temperature: 300.0   # (K)
