mechanical:
  steel:
  - type: Clamp_x
    region: xmax

  - type: Clamp_y
    region: ymin

  - type: Dirichlet_y
    region: ymax
    # prescribed displacement ramp (m), one value per step
    displacement: [0.00e+00, 2.00e-05, 4.00e-05, 6.00e-05, 8.00e-05, 1.00e-04, 1.20e-04, 1.40e-04, 1.60e-04, 1.80e-04, 2.00e-04, 2.20e-04, 2.40e-04, 2.60e-04, 2.80e-04, 3.00e-04, 4.00e-04, 5.00e-04, 6.00e-04]

thermal:
  steel:
  - type: Dirichlet
    region: xmax
    temperature: 300.0   # (K)

damage:
  steel:
  - type: Dirichlet
    region: crack
    value: 1.0   # (/)
