mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml
materials:
  cyl_1: fuel.yaml
  cyl_2: clad.yaml
regime: axisymmetric
solver_settings:
  coupling: staggered
  max_iters: 300
  relax_T: 1.0
  relax_u: 0.3
  relax_adaptive: true
  relax_growth: 1.1
  relax_shrink: 0.6
  relax_min: 0.03
  relax_max: 0.9
models:
  thermal: true
  mechanical: true
  contact:
    surface_a: xmax_1
    surface_b: xmin_2
    penalty_stiffness: 1.0e14
    initial_gap: 3.0e-05
mechanical:
  order: 2
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-06
  stag_tol: 1.0e-05
  convergence: rel_norm
thermal:
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-07
  stag_tol: 1.0e-06
  convergence: rel_norm
  analysis: stationary
lhr:
- 0.0
- 90000.0
time:
- 0.0
- 1.0
n_steps: 13
