thermal:
  fuel:
  - type: Neumann
    region: bottom_1
    flux: 0.0

  - type: Neumann
    region: top_1
    flux: 0.0

  - type: Neumann
    region: axis_1
    flux: 0.0

  - type: Robin
    region: lateral_1
    pair: inner_2

  clad:
  - type: Neumann
    region: bottom_2
    flux: 0.0

  - type: Neumann
    region: top_2
    flux: 0.0

  - type: Robin
    region: inner_2
    pair: lateral_1

  - type: Robin
    region: outer_2
    h_conv: 3.5e4        # (W/(m²K))
    T_ext: 580.0         # (K)

mechanical:
  fuel:
  - type: Clamp_x
    region: axis_1        # u_r = 0

  - type: Clamp_y
    region: bottom_1      # u_z = 0

    
  clad:
  - type: Clamp_y
    region: bottom_2      # u_z = 0

  # outer_2 is left traction-free, which is Esposito's hub boundary condition
  # (sigma_r(c) = 0). The previous Clamp_x (u_r = 0) held the outer radius
  # fixed, so creep could only redistribute stress until the deviatoric part
  # vanished and then stopped, freezing the contact pressure at a residual
  # plateau instead of decaying as a power law.
  #
  # - type: Clamp_x
  #   region: outer_2




