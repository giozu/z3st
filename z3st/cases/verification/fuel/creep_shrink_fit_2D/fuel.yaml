name: UO2-fuel

# NON-fissile on purpose. Esposito eq. (21) relaxes a shrink fit assembled
# once at a FIXED interference Delta; with a fissile pellet the burnup-driven
# swelling eigenstrain below keeps growing Delta (70.8 MWd/kgU at 20 kW/m over
# 2500 days), so the contact pressure rises to ~160 MPa instead of relaxing
# and the comparison is meaningless. Burnup stays at zero here, which switches
# off both the swelling and densification terms.
fissile: false

radial_profile: materials.fuel_profiles.rim_peaking
radial_peak_amplitude: 2.0
radial_peak_exponent: 8.0

E: 200.0e9          # (Pa)
nu: 0.345           # (-)

cracking: isotropic

k: materials.fuel_thermal.k    # W/(m·K)
cp: 280.0           # (J/(kg·K))
rho: 10960.0        # (kg/m³)
heavy_metal_fraction: 0.8815   # (/) M_U/M_UO2

alpha: 1.1e-5       # (1/K) thermal expansion

eigenstrain: materials.fuel_swelling.solid_gas_densification
swelling_rate: 7.0e-4          # (ΔV/V) per MWd/kgU
gas_swelling_rate: 4.0e-4      # (ΔV/V) per MWd/kgU
gas_T_onset: 1200.0            # (K) gaseous-swelling sigmoid centre
gas_T_width: 150.0             # (K) sigmoid width
densification_dv: 0.010        # (ΔV/V) as-fabricated porosity recovered
densification_bu: 2.0          # (MWd/kgU) densification burnup constant

T_ref: 293.15       # (K)
T_initial: 580.0    # (K)
