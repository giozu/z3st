thermal:
  mat0:
  - type: Dirichlet
    region: inner
    temperature: 494.0

  - type: Dirichlet
    region: outer
    temperature: 491.0

mechanical:
  mat0:
  - type: Neumann
    region: inner
    traction: 0.0

  - type: Dirichlet
    region: outer
    displacement: [0.0, 0.0, 0.0]

  # octant symmetry: zero normal displacement on the three coordinate planes
  - type: Clamp_x
    region: xmin

  - type: Clamp_y
    region: ymin

  - type: Clamp_z
    region: zmin
