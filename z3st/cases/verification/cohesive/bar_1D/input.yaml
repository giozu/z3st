# Z3ST: An open-source FEniCSx framework for thermo-mechanical analysis
# Author: Giovanni Zullo
# Version: 0.3.2 (2026)
# --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. ---
#
# Cohesive phase-field fracture, 1D bar in tension.
# Vicentini et al., J. Mech. Phys. Solids 207 (2026) 106424, Sec. 5.2.
#
# ell_ch = Gc E / sigma_c^2 = 4e-4 m, so the structural brittleness ratio
# B = 2L / ell_ch = 5 (the snap-back case of the paper's Fig. 8) and
# ell / ell_ch = 0.125 satisfies the strain-hardening condition (<= 1/4).

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  bar: material.yaml

regime: 1d

solver_settings:
  max_iters: 500
  relax_u: 1.0

models:
  mechanical: true
  cohesive:
    ell: 5.0e-5          # regularization length (m), = h * 5
    # Confine the eigenstrain to the central element, as the paper does in
    # its 1D study (Sec. 5.2), so the computed branch is directly comparable
    # with the analytical localized solution.
    eigenstrain_band: [0.995e-3, 1.005e-3]

mechanical:
  solver: nonlinear
  rtol: 1.0e-8
  stag_tol: 1.0e-8
  convergence: rel_norm

lhr:
- 0.0
- 0.0
time:
- 0.0
- 140.0
n_steps: 140
