mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  steel: ../../../../materials/vessel_steel_0.yaml

regime: 3d

solver_settings:
  max_iters: 20
  relax_T: 1.0
  relax_u: 1.0
  relax_adaptive: false

models:
  thermal: true
  mechanical: true

mechanical:
  solver: linear
  # The BCs leave the x-translation free; it is removed as a nullspace, which needs a Krylov solver (iterative_amg).
  remove_rigid_nullspace: true
  linear_solver: iterative_amg # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-8
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm
  debug: false

thermal:
  solver: linear
  linear_solver: direct_mumps # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm

lhr:
- 0
time:
- 0
n_steps: 1
