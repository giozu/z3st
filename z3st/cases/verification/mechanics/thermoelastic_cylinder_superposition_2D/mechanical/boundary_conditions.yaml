thermal:
  steel:
  - type: Dirichlet
    region: inner_radius
    temperature: 300.0   # (K) = T_ref: no thermal strain

  - type: Dirichlet
    region: outer_radius
    temperature: 300.0   # (K) = T_ref: no thermal strain

mechanical:
  steel:
  - type: Clamp_y
    region: bottom

  - type: Neumann
    region: inner_radius
    traction: -50.0e+6   # (Pa) internal pressure Pi = 50 MPa

  - type: Neumann
    region: outer_radius
    traction: 0.0   # (Pa)
