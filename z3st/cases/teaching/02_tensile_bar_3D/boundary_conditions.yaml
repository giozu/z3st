mechanical:
  steel:
  # The bar is held on the interior planes x = 0 and y = 0, which the exact solution
  # leaves at u_x = 0 and u_y = 0 anyway (u_x = -nu eps x): the constraints remove the
  # rigid-body motions and nothing else. The bottom end is held axially only, so nothing
  # restrains the lateral contraction and the bar is in uniaxial stress.
  - type: Clamp_x
    region: symx

  - type: Clamp_y
    region: symy

  - type: Clamp_z
    region: bottom

  - type: Neumann
    region: top
    traction: 1.909859e+8   # F/A = 15 kN / (pi 5^2 mm^2) = 191 MPa, tensile
