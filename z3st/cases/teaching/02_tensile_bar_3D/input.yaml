mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  steel: ../../../materials/steel.yaml

regime: 3d

solver_settings:
  max_iters: 20
  relax_u: 1.0
  relax_adaptive: false

models:
  mechanical: true

mechanical:
  solver: linear
  # The bar is held only axially (boundary_conditions.yaml).
  # With "remove_rigid_nullspace: true", z3st finds by itself thr free six rigid motions. 
  # It attaches them to the matrix as nullspace, and the solver removes them from the known term and solution.
  # The operator is then singular, which is what a Krylov solver is built for, so iterative solver rather than LU.
  remove_rigid_nullspace: true
  linear_solver: iterative_hypre
  rtol: 1.0e-12
  stag_tol: 1.0e-8
  convergence: rel_norm
  debug: false

lhr:
- 0.0
time:
- 0.0
n_steps: 1
