# Hexagonal shell, heat flux q on the inner faces, T_o on the outer faces
mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  steel: 15_15Ti_local.yaml

regime: 3d

solver_settings:
  max_iters: 100
  relax_T: 1.0
  relax_u: 1.0 
  relax_adaptive: false 

models:
  thermal: true
  mechanical: true

thermal:
  solver: linear
  linear_solver: direct_mumps # direct_mumps | iterative_amg** | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm

mechanical:
  solver: linear
  linear_solver: direct_mumps # direct_mumps | iterative_amg | iterative_hypre
  remove_rigid_nullspace: true # More applications, here for not unique solution for displacements, dilatation around initial position
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm
  
lhr: #linear heat rate (power generation)
- 0.0
time: # steady state, one static step at t = 0 (k(T) iterated within the step)
- 0.0
n_steps: 1

# time_adaptivity:
#   enabled: true
#   dt_min: 1.0e+4
#   max_cuts: 8

output:
  format: xdmf #time series complete output vs vtu per timestep
  filename: fields # output/fields.xdmf + .h5
