# IAEA VP1 (1990) on a circular tube of the same mid-wall perimeter: reference for the corner effect
mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  steel: 15_15Ti_local.yaml

regime: 3d

solver_settings:
  max_iters: 100
  relax_T: 1.0
  relax_u: 1.0 
  relax_adaptive: false 

models:
  thermal: false # T imposed by vp1_temperature.py, as MOOSE VP1 reads `temp`
  mechanical: true

thermal:
  solver: linear
  linear_solver: direct_mumps # direct_mumps | iterative_amg** | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm

mechanical:
  solver: linear
  linear_solver: direct_mumps # direct_mumps | iterative_amg | iterative_hypre
  remove_rigid_nullspace: false # bottom fully clamped (Clamp_x/y/z, as MOOSE VP1): no rigid-body mode left
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm
  
lhr: #linear heat rate (power generation)
- 0.0
time: # steady state, one static step at t = 0 (more steps give identical fields)
- 0.0
n_steps: 1

# time_adaptivity:
#   enabled: true
#   dt_min: 1.0e+4
#   max_cuts: 8

output:
  format: xdmf #time series complete output vs vtu per timestep
  filename: vp1_tube_fields_3d # output/vp1_tube_fields_3d.xdmf + .h5
