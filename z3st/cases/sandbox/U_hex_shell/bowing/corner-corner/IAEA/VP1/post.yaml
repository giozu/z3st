# Post-processing of this subfolder: python ../../../../hex_post.py . (paths relative to here)
fields: output/vp1_const_fields_3d.xdmf
material: 15_15Ti_const.yaml
temperature: field                  # thermal model on: T(y, z) of VP1 as Dirichlet, in the fields file
option: z-gradient                   # axial ramp across the core (Z_UNIFORM = False): compared only with the same option
support: clamped                     # bottom fully clamped (IAEA VP1)
closed_form: vp1:vp1_temperature   # kappa = alpha (T2 - T1) / D, VTB hex_duct_linear
stations_z: [1.0, 1.5, 2.5, 3.0, 4.0]   # VTB table: core top 2.5, ACLP 3.0, duct top 4.0
along_s_z:                           # heights of the along-s figures (m): core inlet, mid, outlet and duct tip
  inlet core: 1.5
  mid core: 2.0
  outlet core: 2.5
  tip: 4.0
