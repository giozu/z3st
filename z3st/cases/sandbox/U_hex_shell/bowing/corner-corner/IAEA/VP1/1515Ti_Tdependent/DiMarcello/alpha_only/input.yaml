# IAEA VP1 (1990), separate effects: eta(T) of the Di Marcello set with E constant.
# Same mesh, geometry, BCs and T as ../ (Di Marcello set), ../../ (Sobolev set) and ../../../ (constant card).
mesh_path: ../../../mesh.msh
geometry_path: ../../../geometry.yaml
boundary_conditions_path: ../../boundary_conditions.yaml

materials:
  steel: 1515Ti_alpha_only_DM.yaml

regime: 3d

solver_settings:
  max_iters: 100
  relax_T: 1.0
  relax_u: 1.0
  relax_adaptive: false

models:
  thermal: true # T(y, z) of VP1 imposed as Dirichlet on the faces (../../boundary_conditions.yaml)
  mechanical: true

thermal:
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm

mechanical:
  solver: linear
  linear_solver: direct_mumps
  remove_rigid_nullspace: false # bottom fully clamped (Clamp_x/y/z, as MOOSE VP1)
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm

lhr:
- 0.0
time: # steady state, one static step at t = 0
- 0.0
n_steps: 1

output:
  format: xdmf
  filename: vp1_DM_alpha_only_fields_3d # output/vp1_DM_alpha_only_fields_3d.xdmf + .h5
