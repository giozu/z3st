name: 15-15 Ti (VP1, constant)

# IAEA VP1 constant properties on the solved VP1 temperature (Dirichlet T(y, z),
# boundary_conditions.yaml). Thermal strain alpha (T - T_ref) I from z3st, no hook.
# Reference of 1515Ti_Tdependent/ (same mesh, BCs and T).

# Mechanical properties
E: 1.7e+11        # Young's modulus (Pa), IAEA VP1: 1.7e5 MPa
nu: 0.3           # Poisson's ratio (-), IAEA VP1
alpha: 1.8e-5     # Thermal expansion coefficient (1/K), IAEA VP1: 18e-6 1/°C
T_ref: 673.15     # Stress-free temperature (K), VP1 stress_free_temperature = 400 °C

# Thermal properties (T fixed by the Dirichlet on every node: no effect)
k: 20.0           # (W/m·K)
cp: 500.0         # (J/kg·K)

# Physical properties
rho: 7750         # Density (kg/m³)
