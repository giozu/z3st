# Post-processing of this subfolder: python vp2_post.py (hex_post figures with the VP2 closed form; paths relative to here)
fields: output/vp2_fields_3d.xdmf
material: 15_15Ti_local.yaml
temperature: vp2_temperature.T_vp2   # thermal model off: T imposed, not in the fields file
option: z-gradient                   # axial ramp across the core, as VP1: compared only with the same option
support: clamped                     # bottom fully clamped (IAEA VP1/VP2)
closed_form: vp2:vp2_temperature     # kappa = (4/3) alpha (T2 - T1) / D (vp2_post.py)
stations_z: [1.0, 1.5, 2.5, 3.0, 4.0]   # IWGFR/75 tables: core top 2.5, LRP 3.0, URP 4.0
along_s_z:                           # heights of the along-s figures (m): core inlet, mid, outlet and duct tip
  inlet core: 1.5
  mid core: 2.0
  outlet core: 2.5
  tip: 4.0
