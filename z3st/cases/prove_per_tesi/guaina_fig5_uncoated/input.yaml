mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  zircaloy: zircaloy_uncoated.yaml

regime: axisymmetric

solver_settings:
  max_iters: 25
  relax_T: 0.9
  relax_u: 0.5
  relax_aitken: true
  relax_adaptive: true
  relax_min: 0.05
  relax_max: 1.0

time_adaptivity:
  enabled: true
  dt_min: 0.05
  max_cuts: 8

models:
  thermal: true
  mechanical: true

thermal:
  analysis: transient
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-6
  stag_tol: 1.0e-5
  convergence: rel_norm

mechanical:
  solver: nonlinear
  linear_solver: direct_mumps
  rtol: 1.0e-6
  stag_tol: 1.0e-4
  convergence: rel_norm
  order: 1

time: [0.0, 87.5]
lhr:  [0.0, 0.0]
n_steps: 175

output:
  format: xdmf
  filename: simulation.xdmf
