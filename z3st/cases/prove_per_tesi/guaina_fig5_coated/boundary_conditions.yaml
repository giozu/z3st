mechanical:
  # Closed-end tube: bottom = end-cap, top free with the end-cap load
  # p*Ri^2/(Ro^2-Ri^2), applied once (region top spans every material).
  zircaloy:
    - { type: Neumann, region: inner, traction: -4.1e+6 } # inner pressure
    - { type: Neumann, region: top, traction: 1.3690e+07 } # cap, load (axial eq.)
    # - { type: Dirichlet, region: top, displacement: [0.0, 0.0] }
    - { type: Clamp_x, region: top}    # top cap, tappo, u_r = 0 on top
    - { type: Clamp_y, region: bottom} # bottom fixed on z
    - { type: Clamp_x, region: bottom} # bottom cap, tappo, u_r = 0 on bottom
  # chromium: # commentato perche le boundary conditions top e bottom di zircaloy valgono anche qui
    # - { type: Clamp_x, region: top}    # top cap, tappo, u_r = 0 on top (commentato perche quello sopra vale anche per chromium, la linea "top è una sola")
    # - { type: Clamp_y, region: bottom} # bottom fixed on z (idem)
    # - { type: Clamp_x, region: bottom} # bottom cap, tappo, u_r = 0 on bottom (idem)
