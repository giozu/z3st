mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  plate: plate_ceramic.yaml

regime: 2d

output:
  format: xdmf

solver_settings:
  max_iters: 500
  relax_T: 0.8
  relax_u: 1.0
  relax_D: 1.0
  relax_adaptive: false

models:
  thermal: true
  mechanical: true
  damage: true

mechanical:
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-6
  stag_tol: 1.0e-4
  convergence: rel_norm

thermal:
  analysis: transient
  solver: linear
  linear_solver: iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm

damage:
  type: AT1                 # elastic threshold -> physical nucleation strength
  solver: linear
  linear_solver: iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-3
  convergence: rel_norm
  lc: 9.2e-5
  split: amor
  hybrid_constraint: true

lhr:
  - 0.0
  - 0.0

time:
  - 0.0
  - 0.005

n_steps: 50
