mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  solid: ../../../../materials/uo2_jiang.yaml
  # NOTE: repointed from the shared uo2.yaml during the feature/PFF -> develop transfer.
  # The shared card is calibrated for pellet_quench (sigma_c = 1 GPa); Baptiste's cases
  # were developed against sigma_c = 150 MPa / T_ref = 1023.15 K. uo2_jiang.yaml gives Gc
  # directly (Gc = 2.0) and T_ref = 293.15 -- TODO(Baptiste): confirm before blessing golds.

regime: 3d

solver_settings:
  coupling: staggered
  max_iters: 100
  relax_T: 0.9
  relax_u: 0.4
  relax_adaptive: true
  relax_growth: 1.1
  relax_shrink: 0.7
  relax_min: 0.05
  relax_max: 1.0

models:
  thermal: false
  mechanical: true
  damage: true

mechanical:
  solver: linear
  linear_solver: iterative_amg # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  
  convergence: rel_norm # rel_norm | norm
  debug: false

thermal:
  solver: linear
  linear_solver: iterative_amg # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm

damage:
  type: AT1
  solver: linear
  linear_solver: iterative_amg
  lc: 5.0e-7
  hybrid_constraint: true
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm

lhr:
- 0.0
- 0.0
time:
- 0.0
- 1.0
n_steps: 50
