mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  # solid: ../../../../materials/oxide.yaml
  uo2: ../../../../materials/uo2_jiang.yaml
  # NOTE: repointed from the shared uo2.yaml during the feature/PFF -> develop transfer.
  # The shared card is calibrated for pellet_quench (sigma_c = 1 GPa); Baptiste's cases
  # were developed against sigma_c = 150 MPa / T_ref = 1023.15 K. uo2_jiang.yaml gives Gc
  # directly (Gc = 2.0) and T_ref = 293.15 -- TODO(Baptiste): confirm before blessing golds.

regime: 2D

solver_settings:
  coupling: staggered
  max_iters: 100
  relax_T: 0.9
  relax_u: 0.7
  relax_adaptive: true
  relax_growth: 1.1
  relax_shrink: 0.7
  relax_min: 0.05
  relax_max: 1.0

models:
  thermal: false
  mechanical: true
  damage: true # Enable damage to observe the plate fracture

mechanical:
  solver: linear
  linear_solver: iterative_hypre # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm
  debug: false

thermal:
  solver: linear
  linear_solver: iterative_hypre # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm

damage:
  type: AT2
  solver: linear
  linear_solver: iterative_hypre # direct_mumps | iterative_amg | iterative_hypre
  rtol: 1.0e-6
  stag_tol: 1.0e-6
  convergence: rel_norm # rel_norm | norm
  # lc: 0.004
  lc: 5.0e-7 #as the article 
  hybrid_constraint: true


lhr:
- 0.0
- 0.0
time:
- 0.0
- 3600.0
n_steps: 101

# # Fictive time for a static ramp
# n_steps: 100
# time: [0.0, 1.0]
# lhr: [0.0, 0.0]

output:
  format: "xdmf"
  filename: "results.xdmf"

# output:
#   format: vtu
#   filename: simulation.vtu