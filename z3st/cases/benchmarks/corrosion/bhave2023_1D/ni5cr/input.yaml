# V2: Bhave et al. 2023 (J. Nucl. Mater. 574, 154147) 1D benchmark, Ni-5Cr in FLiBe at 973 K.
# Surface: Bhave c_surf = 1.8e-3 (mass fraction) as an atomic fraction.

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  alloy: alloy.yaml

regime: 1d

solver_settings:
  max_iters: 5

models:
  corrosion: true

corrosion:
  T: 973.0
  linear_solver: direct_mumps
  depth_axis: 0
  depletion_threshold: 0.843
  surface:
    type: fixed
    x_surf: 2.0315e-3

output:
  format: vtu

