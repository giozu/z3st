thermal:
  fuel:
  - type: Neumann
    region: bottom_1
    flux: 0.0

  - type: Neumann
    region: top_1
    flux: 0.0

  - type: Neumann
    region: axis_1
    flux: 0.0

  - type: Robin
    region: lateral_1
    pair: inner_2

  clad:
  - type: Neumann
    region: bottom_2
    flux: 0.0

  - type: Neumann
    region: top_2
    flux: 0.0

  - type: Robin
    region: inner_2
    pair: lateral_1

  - type: Dirichlet
    region: outer_2
    temperature: 300.0         # (K)

mechanical:
  fuel:
  - type: Clamp_x
    region: axis_1        # u_r = 0

  - type: Clamp_y
    region: bottom_1      # u_z = 0

  - type: Neumann
    region: lateral_1
    traction: -1.0e+5     # (Pa)

  - type: Neumann
    region: top_1
    traction: -1.0e+5     # (Pa)
    
  clad:
  - type: Clamp_y
    region: bottom_2      # u_z = 0

  - type: Neumann
    region: outer_2
    traction: -1.e+5    # (Pa)

  - type: Neumann
    region: inner_2
    traction: -1.0e+5     # (Pa)
