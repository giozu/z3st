# Zest: A FEniCSx module for fuel performance modeling
# =====================================================
# Author: Giovanni Zullo
# Date: 16/01/2025

# Description:
# ------------
# Zest is a thermomechanical fuel performance code written in Python.
# This project is currently under development.

mesh_path: mesh/fuel_rod_structured.msh
geometry_path: geometry/fuel_rod_structured.yaml
boundary_conditions_path: conditions/boundary_conditions.yaml

materials:
  fuel: materials/uo2.yaml
  cladding: materials/T91.yaml
  # gas: materials/he.yaml
  # coolant: materials/h2o.yaml

solver_settings:
  coupling: staggered
  thermal_solver: iterative_amg
  mechanical_solver: iterative_amg
  tol: 1e-2
  tol_T: 1e-2
  tol_u: 1e-2
  tol_mech: 1e-3
  tol_th: 1e-4
  relax_T: 0.7
  relax_u: 0.9
  n_iter_max: 50

models:
  thermal: True
  mechanical: True

lhr:
  - 10000
time:
  - 0
n_steps: 1

